name: Upload Rendered Artifact to Google Drive (OAuth 2.0 Rclone)

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Nama Artifact Zip yang akan di-upload'
        required: true
        default: 'tech-framing-target-reticles-20pack-alpha-4k'

jobs:
  upload-gdrive-oauth:
    name: Upload Zip Artifact to Google Drive via OAuth 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Latest Rendered Zip Artifact Across Workflows
        run: |
          mkdir -p ./downloaded-artifact
          gh run download --name "${{ github.event.inputs.artifact_name }}" --dir ./downloaded-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Downloaded Zip File
        run: |
          ls -la ./downloaded-artifact

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone with OAuth 2.0 User Token
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          scope = drive
          token = {"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"0001-01-01T00:00:00Z"}
          EOF

      - name: Upload Zip File directly to Personal Google Drive Folder
        run: |
          ZIP_FILE=$(find ./downloaded-artifact -name "*.zip" | head -n 1)
          echo "Uploading $ZIP_FILE to Google Drive folder ${{ secrets.GDRIVE_FOLDER_ID }}..."
          rclone copy "$ZIP_FILE" "gdrive:${{ secrets.GDRIVE_FOLDER_ID }}" --progress
