name: Render All 4K Revised Broadcast Lower Thirds (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Revised Broadcast Lower Thirds (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "LowerThird-01-ViscousVectorWave"
            "LowerThird-02-SplineExpansion"
            "LowerThird-03-AsymmetricalRibbonFold"
            "LowerThird-04-DiagonalSlateShear"
            "LowerThird-05-DeconstructedVectorSlice"
            "LowerThird-06-FluidMaskReveal"
            "LowerThird-07-BezierPathTracer"
            "LowerThird-08-PolygonalMeshUnfold"
            "LowerThird-09-MetallicLiquidRibbon"
            "LowerThird-10-ChiseledPrismUnravel"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../revised-broadcast-lower-thirds-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revised-broadcast-lower-thirds-prores-4k
          path: revised-broadcast-lower-thirds-prores-4k.zip
          retention-days: 14
