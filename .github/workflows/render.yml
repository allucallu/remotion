name: Render All 4K Anti-Generic Lower Thirds Batch 2 (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Anti-Generic Lower Thirds Batch 2 (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "LowerThird-01-ChronoDialUnmask"
            "LowerThird-02-MatrixGlitchShift"
            "LowerThird-03-PortalApertureSlice"
            "LowerThird-04-CubePerspectiveUnfold"
            "LowerThird-05-HelixRibbonWeave"
            "LowerThird-06-CascadeShutterSqueeze"
            "LowerThird-07-OrbitalRingConstruct"
            "LowerThird-08-SlantedBellowsExpand"
            "LowerThird-09-SplitCrosshatchSnap"
            "LowerThird-10-ConcentricRingBurst"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../anti-generic-lower-thirds-batch2-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-generic-lower-thirds-batch2-prores-4k
          path: anti-generic-lower-thirds-batch2-prores-4k.zip
          retention-days: 14
