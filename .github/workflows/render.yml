name: Render Corporate Background Videos

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render:
    name: Render ${{ matrix.composition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composition:
          - Corporate-01-GradientFlow
          - Corporate-02-AuroraWave
          - Corporate-03-BlobMorph
          - Corporate-04-ParticleDrift
          - Corporate-05-GeometricPulse
          - Corporate-06-NoiseField
          - Corporate-07-WaveStack
          - Corporate-08-RadialBreath
          - Corporate-09-LiquidMetal
          - Corporate-10-DiamondGrid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render Video (4K MP4)
        run: |
          mkdir -p out
          npx remotion render ${{ matrix.composition }} out/${{ matrix.composition }}.mp4 --codec=h264

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.composition }}
          path: out/${{ matrix.composition }}.mp4
          retention-days: 14
