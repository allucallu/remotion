name: Render All 4K Radical Lower Thirds (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Radical Lower Thirds (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "LowerThird-01-HexPrismOrigamiFold"
            "LowerThird-02-TrapezoidPedestalDrop"
            "LowerThird-03-RazorCrystalShardFusion"
            "LowerThird-04-DiagonalChevronTectonicShift"
            "LowerThird-05-ReticleSwissGridExpand"
            "LowerThird-06-GoldenRatioModularStack"
            "LowerThird-07-OrganicLiquidPodTear"
            "LowerThird-08-TornEdgeNoiseSweep"
            "LowerThird-09-DualScannerCyberMatrix"
            "LowerThird-10-SlantedParallelogramCascade"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../radical-lower-thirds-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radical-lower-thirds-prores-4k
          path: radical-lower-thirds-prores-4k.zip
          retention-days: 14
