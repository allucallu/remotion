name: Render 4K Cybersecurity UI Stock Assets (VP9 Alpha WebM)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-cybersecurity-pack:
    name: Render Cybersecurity Stock Assets (VP9 Alpha 4K WebM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All Cybersecurity Compositions (VP9 Alpha 4K WebM)
        run: |
          mkdir -p out
          echo "=== 1. Rendering SecurityToastStack ==="
          npm run render:toast
          
          echo "=== 2. Rendering PasswordStrengthMeter ==="
          npm run render:password

          echo "=== 3. Rendering VulnerabilityScanSweep ==="
          npm run render:scan

          echo "=== 4. Rendering EncryptedDataTransfer ==="
          npm run render:transfer

          echo "=== 5. Rendering TwoFactorAuthFlow ==="
          npm run render:2fa

          echo "=== 6. Rendering FirewallNetworkBlock ==="
          npm run render:firewall

          echo "=== 7. Rendering PrivacyToggleSwitcher ==="
          npm run render:privacy

          echo "=== 8. Rendering DataBreachAlertBanner ==="
          npm run render:alert

          echo "=== 9. Rendering ComplianceBadgeReveal ==="
          npm run render:compliance

          echo "=== 10. Rendering LiveThreatCounterTicker ==="
          npm run render:ticker

      - name: Bundle Metadata & Zip Output
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../cybersecurity-stock-assets-alpha-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-stock-assets-alpha-4k
          path: cybersecurity-stock-assets-alpha-4k.zip
          retention-days: 14
