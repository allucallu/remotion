name: Render 4K Cybersecurity UI Stock Assets (H.264 MP4 4K)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-cybersecurity-pack:
    name: Render 4K Cybersecurity Stock Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 15 Cybersecurity Compositions (H.264 MP4 4K)
        run: |
          mkdir -p out
          echo "=== 1. Rendering ScanningGridOverlay ==="
          npm run render:scan-grid

          echo "=== 2. Rendering RotatingCipherLockRings ==="
          npm run render:cipher-lock

          echo "=== 3. Rendering CircuitBoardPulseLines ==="
          npm run render:pcb-pulse

          echo "=== 4. Rendering BinaryCodeCascade ==="
          npm run render:binary-code

          echo "=== 5. Rendering LockAssemblyAnimation ==="
          npm run render:lock-assembly

          echo "=== 6. Rendering VPNConnectionStatusWidget ==="
          npm run render:vpn-widget

          echo "=== 7. Rendering SecureFileTransferCard ==="
          npm run render:file-transfer

          echo "=== 8. Rendering NewLoginAlertCard ==="
          npm run render:login-alert

          echo "=== 9. Rendering AntivirusScanResultCard ==="
          npm run render:antivirus-card

          echo "=== 10. Rendering E2EEncryptionToggleCard ==="
          npm run render:e2e-toggle

          echo "=== 11. Rendering SessionTimeoutCountdownCard ==="
          npm run render:session-timeout

          echo "=== 12. Rendering TrustedDevicesListCard ==="
          npm run render:trusted-devices

          echo "=== 13. Rendering PasswordManagerAutofillPopup ==="
          npm run render:autofill-popup

          echo "=== 14. Rendering SecurityHealthScoreCard ==="
          npm run render:health-score

          echo "=== 15. Rendering DataAccessPermissionCard ==="
          npm run render:permission-card

      - name: Bundle Metadata & Zip Output
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../cybersecurity-stock-assets-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-stock-assets-4k
          path: cybersecurity-stock-assets-4k.zip
          retention-days: 14
