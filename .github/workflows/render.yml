name: Render All 4K Social CTA Lower Thirds (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Social CTA Lower Thirds (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "SocialCta-01-SubscribePill"
            "SocialCta-02-FollowerCount"
            "SocialCta-03-NotifyBell"
            "SocialCta-04-HandleBar"
            "SocialCta-05-PlayWatch"
            "SocialCta-06-LikeEngage"
            "SocialCta-07-JoinCommunity"
            "SocialCta-08-SplitDualBar"
            "SocialCta-09-SwipeUp"
            "SocialCta-10-LiveNow"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../social-cta-lower-thirds-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-cta-lower-thirds-prores-4k
          path: social-cta-lower-thirds-prores-4k.zip
          retention-days: 14
