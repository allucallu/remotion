name: Render 4K UHD Lower Third Motion Graphics Stock Master Pack (H.264 MP4 4K)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-lower-third-pack:
    name: Render 4K Lower Third Stock Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 20 Lower Third Compositions (H.264 MP4 4K)
        run: |
          mkdir -p out
          echo "=== 1. Rendering LowerThirdBroadcast (V1) ==="
          npm run render:lower-third-v1

          echo "=== 2. Rendering LowerThirdMinimal (V2) ==="
          npm run render:lower-third-v2

          echo "=== 3. Rendering LowerThirdBold (V3) ==="
          npm run render:lower-third-v3

          echo "=== 4. Rendering LowerThirdFluid (V4) ==="
          npm run render:lower-third-v4

          echo "=== 5. Rendering LowerThirdRetro (V5) ==="
          npm run render:lower-third-v5

          echo "=== 6. Rendering LowerThirdAsymmetric (V6) ==="
          npm run render:lower-third-v6

          echo "=== 7. Rendering LowerThirdViewfinder (V7) ==="
          npm run render:lower-third-v7

          echo "=== 8. Rendering LowerThirdAnchor (V8) ==="
          npm run render:lower-third-v8

          echo "=== 9. Rendering LowerThirdStack (V9) ==="
          npm run render:lower-third-v9

          echo "=== 10. Rendering LowerThirdMonolith (V10) ==="
          npm run render:lower-third-v10

          echo "=== 11. Rendering LowerThirdHexagon (V11) ==="
          npm run render:lower-third-v11

          echo "=== 12. Rendering LowerThirdGaming (V12) ==="
          npm run render:lower-third-v12

          echo "=== 13. Rendering LowerThirdCorporate (V13) ==="
          npm run render:lower-third-v13

          echo "=== 14. Rendering LowerThirdModularIDCard (V14) ==="
          npm run render:modular-id-card

          echo "=== 15. Rendering LowerThirdHUDBracket (V15) ==="
          npm run render:hud-bracket

          echo "=== 16. Rendering LowerThirdHUDHexGrid (V16) ==="
          npm run render:hud-hex-grid

          echo "=== 17. Rendering LowerThirdGlassPill (V17) ==="
          npm run render:glass-pill

          echo "=== 18. Rendering LowerThirdTypewriterLedger (V18) ==="
          npm run render:typewriter-ledger

          echo "=== 19. Rendering LowerThirdWaveformPulse (V19) ==="
          npm run render:waveform-pulse

          echo "=== 20. Rendering LowerThirdAudioSpectrum (V20) ==="
          npm run render:audio-spectrum

      - name: Bundle Metadata & Zip Output
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../lower-third-stock-pack-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lower-third-stock-pack-4k
          path: lower-third-stock-pack-4k.zip
          retention-days: 14
