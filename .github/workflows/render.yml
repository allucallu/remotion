name: Render All 4K DevTech & SaaS Terminal Visuals Stock Assets

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render 10 DevTech Visuals (ProRes 4444 Alpha MOV & H.264 Solid MP4) & Zip Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (Solid MP4 & Alpha MOV)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "01-CodeTyping"
            "02-ApiJsonStream"
            "03-CicdPipeline"
            "04-TerminalAutocomplete"
            "05-SqlQueryTable"
            "06-ServerPing"
            "07-AiModelTraining"
            "08-GitCommitLog"
            "09-KubernetesPods"
            "10-BuildSuccessBadge"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp-Solid (H.264 MP4) ==="
            npx remotion render "$comp-Solid" "out/$comp-Solid.mp4" --codec=h264

            echo "=== Rendering $comp-Alpha (ProRes 4444 Alpha MOV) ==="
            npx remotion render "$comp-Alpha" "out/$comp-Alpha.mov" --codec=prores --prores-profile=4444
          done

      - name: Bundle Metadata & Zip Video Outputs
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../devtech-saas-terminal-visuals-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devtech-saas-terminal-visuals-4k
          path: devtech-saas-terminal-visuals-4k.zip
          retention-days: 14
