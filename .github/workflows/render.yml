name: Render All 20 4K Tech Framing & Target Reticles (Alpha ProRes 4444)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-hud-alpha-20pack:
    name: Render Tech Framing & Target Reticles (20 ProRes 4444 Alpha MOV Videos)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 20 HUD Alpha Compositions (ProRes 4444 Alpha MOV)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "01-TargetLockReticle-Alpha"
            "02-RotatingTechFrame-Alpha"
            "03-IronmanStyleHUD-Alpha"
            "04-ScanningGridFrame-Alpha"
            "05-CyberpunkCornerFrame-Alpha"
            "06-RadarSweepTracking-Alpha"
            "07-SatelliteOrbitalLock-Alpha"
            "08-DroneTrackingBox-Alpha"
            "09-HolographicWireframePanel-Alpha"
            "10-SystemChargeUpRing-Alpha"
            "11-MultiLayerDataStream-Alpha"
            "12-ParticleEnergyField-Alpha"
            "13-CommandConsoleFrame-Alpha"
            "14-NeuralNetworkFrame-Alpha"
            "15-ARMultiTagFrame-Alpha"
            "16-GlitchDistortionFrame-Alpha"
            "17-CircuitBoardFrame-Alpha"
            "18-EnvironmentalScanHUD-Alpha"
            "19-LaunchSequenceCountdown-Alpha"
            "20-KineticDataTicker-Alpha"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha MOV) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Bundle Metadata & Zip Video Outputs
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../tech-framing-target-reticles-20pack-alpha-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-framing-target-reticles-20pack-alpha-4k
          path: tech-framing-target-reticles-20pack-alpha-4k.zip
          retention-days: 14
