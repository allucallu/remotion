name: Render All 4K Batch 2 Lower Thirds (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Batch 2 Lower Thirds (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "LowerThird-01-RefractivePrismUnfold"
            "LowerThird-02-FrostedLiquidSlide"
            "LowerThird-03-HardOffsetSnap"
            "LowerThird-04-AsymmetricalStaggerGrid"
            "LowerThird-05-TargetReticleExpand"
            "LowerThird-06-QuantumCircuitReveal"
            "LowerThird-07-ElasticVectorSweep"
            "LowerThird-08-StaggeredRuleCascade"
            "LowerThird-09-BeveledGoldShimmer"
            "LowerThird-10-MetallicInsetSlide"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../batch2-lower-thirds-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch2-lower-thirds-prores-4k
          path: batch2-lower-thirds-prores-4k.zip
          retention-days: 14
