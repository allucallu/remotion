name: Render 4K Technology & Data Motion Graphics Stock Pack (H.264 MP4 4K)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-tech-data-pack:
    name: Render 4K Tech & Data Stock Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 11 Technology Compositions (H.264 MP4 4K)
        run: |
          mkdir -p out
          echo "=== 1. Rendering LiveJSONResponseStream ==="
          npm run render:live-json

          echo "=== 2. Rendering DigitalDataStreamBackground ==="
          npm run render:data-stream

          echo "=== 3. Rendering StatusIndicatorBadgeCycle ==="
          npm run render:badge-cycle

          echo "=== 4. Rendering DataFlowConnectionPulse ==="
          npm run render:flow-pulse

          echo "=== 5. Rendering RequestBuilderMockup ==="
          npm run render:request-builder

          echo "=== 6. Rendering TerminalCurlTyping ==="
          npm run render:terminal-typing

          echo "=== 7. Rendering JSONTreeExpandCollapse ==="
          npm run render:tree-expand

          echo "=== 8. Rendering LoadingResultTransition ==="
          npm run render:loading-result

          echo "=== 9. Rendering HeaderInspectorPanel ==="
          npm run render:header-inspector

          echo "=== 10. Rendering RealtimeDataTicker ==="
          npm run render:data-ticker

          echo "=== 11. Rendering DataDiffValidationOverlay ==="
          npm run render:diff-validation

      - name: Bundle Metadata & Zip Output
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../tech-data-stock-assets-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-data-stock-assets-4k
          path: tech-data-stock-assets-4k.zip
          retention-days: 14
