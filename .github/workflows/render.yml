name: Render All 4K Lower Thirds (ProRes 4444 Alpha Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Lower Thirds (ProRes 4444 Alpha) & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K ProRes 4444 Alpha)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "LowerThird-01-Corporate"
            "LowerThird-02-Broadcast"
            "LowerThird-03-TechPill"
            "LowerThird-04-Editorial"
            "LowerThird-05-Podcast"
            "LowerThird-06-Cinema"
            "LowerThird-07-Sports"
            "LowerThird-08-Finance"
            "LowerThird-09-Creative"
            "LowerThird-10-CyberTech"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp (ProRes 4444 Alpha) ==="
            npx remotion render "$comp" "out/$comp.mov" --codec=prores --prores-profile=4444
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../lower-thirds-prores-4k.zip *.mov
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lower-thirds-prores-4k
          path: lower-thirds-prores-4k.zip
          retention-days: 14
