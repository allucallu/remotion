name: Render 4K UHD Motion Graphics Stock Assets (H.264 MP4 4K)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-stock-pack:
    name: Render 4K Stock Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render Compositions (H.264 MP4 4K)
        run: |
          mkdir -p out
          npx remotion render CountdownTimerFilmLeader out/CountdownTimer_FilmLeader_4K.mp4 --codec=h264
          npx remotion render CountdownTimerCyberHUD out/CountdownTimer_CyberHUD_4K.mp4 --codec=h264
          npx remotion render CountdownTimerMinimalLuxury out/CountdownTimer_MinimalLuxury_4K.mp4 --codec=h264
          npx remotion render CountdownTimerSwissEditorial out/CountdownTimer_SwissEditorial_4K.mp4 --codec=h264
          npx remotion render CountdownTimerFluidOrganic out/CountdownTimer_FluidOrganic_4K.mp4 --codec=h264
          npx remotion render CountdownTimerTerminalBoot out/CountdownTimer_TerminalBoot_4K.mp4 --codec=h264
          npx remotion render CountdownTimerChronometerVintage out/CountdownTimer_ChronometerVintage_4K.mp4 --codec=h264
          npx remotion render CountdownTimerTerminalSplitGrid out/CountdownTimer_TerminalSplitGrid_4K.mp4 --codec=h264
          npx remotion render CountdownTimerFlipClock out/CountdownTimer_FlipClock_4K.mp4 --codec=h264
          npx remotion render CountdownTimerFlipClockAviation out/CountdownTimer_FlipClockAviation_4K.mp4 --codec=h264
          npx remotion render CountdownTimerRadialEnergy out/CountdownTimer_RadialEnergy_4K.mp4 --codec=h264
          npx remotion render CountdownTimerPortalEnergy out/CountdownTimer_PortalEnergy_4K.mp4 --codec=h264
          npx remotion render CountdownTimerTitaniumCore out/CountdownTimer_TitaniumCore_4K.mp4 --codec=h264
          npx remotion render CountdownTimerSolarLoom out/CountdownTimer_SolarLoom_4K.mp4 --codec=h264
          npx remotion render CountdownTimerPaperCutout out/CountdownTimer_PaperCutout_4K.mp4 --codec=h264
          npx remotion render CountdownTimerInkWash out/CountdownTimer_InkWash_4K.mp4 --codec=h264
          npx remotion render CountdownTimerShatterGrid out/CountdownTimer_ShatterGrid_4K.mp4 --codec=h264
          npx remotion render CountdownTimerCrystalShard out/CountdownTimer_CrystalShard_4K.mp4 --codec=h264
          npx remotion render CountdownTimerSundialShadow out/CountdownTimer_SundialShadow_4K.mp4 --codec=h264

      - name: Bundle Metadata & Zip Output
        run: |
          cp metadata.csv out/
          cd out
          zip -r ../stock-assets-4k.zip *
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-assets-4k
          path: stock-assets-4k.zip
          retention-days: 14
