name: Render All Corporate Background Videos (Zip Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render-all:
    name: Render All 10 Backgrounds & Bundle to Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render All 10 Compositions (4K MP4)
        run: |
          mkdir -p out
          COMPOSITIONS=(
            "Corporate-01-GradientFlow"
            "Corporate-02-AuroraWave"
            "Corporate-03-BlobMorph"
            "Corporate-04-ParticleDrift"
            "Corporate-05-GeometricPulse"
            "Corporate-06-NoiseField"
            "Corporate-07-WaveStack"
            "Corporate-08-RadialBreath"
            "Corporate-09-LiquidMetal"
            "Corporate-10-DiamondGrid"
          )
          for comp in "${COMPOSITIONS[@]}"; do
            echo "=== Rendering $comp ==="
            npx remotion render "$comp" "out/$comp.mp4" --codec=h264
          done

      - name: Zip Rendered Videos
        run: |
          cd out
          zip -r ../corporate-backgrounds-4k.zip *.mp4
          cd ..

      - name: Upload Zip Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-backgrounds-4k
          path: corporate-backgrounds-4k.zip
          retention-days: 14
